<section class="cards">
  <div class="cards__container">
    @for (item of filmService.filteredFilms(); track item.id) {
      <app-film-card [film]="item"></app-film-card>
    } @empty {
      <div class="cards__not-found">Фільми не знайдено...</div>
    }
  </div>
</section>
