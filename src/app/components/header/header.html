<header class="header">
  <div class="header__container">
    <div class="header__logo">
      <span class="header__brand">Film</span>
      <span class="header__project">Collection</span>
    </div>

    <nav class="header__nav">
      <a
        routerLink="/"
        class="header__link"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/about" class="header__link" routerLinkActive="header__link--active">About</a>
    </nav>
    <div class="header__fav">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        ></path>
      </svg>
      @if (filmService.favoritesCount() > 0) {
        <span class="header__fav-count">{{ filmService.favoritesCount() }}</span>
      }
    </div>
  </div>
</header>
