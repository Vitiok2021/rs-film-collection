<a [routerLink]="['/films', film().id]" class="card">
  <div class="card__poster">
    <img [src]="film().posterUrl" [alt]="film().title" />
  </div>
  <div class="card__body">
    <h2 class="card__title">{{ film().title }}</h2>
    <div class="card__info">
      <div class="card__year">{{ film().year }}</div>
      <div class="card__genre">{{ film().genre }}</div>
    </div>
    <div class="card__action">
      <div class="card__rating">{{ film().rating }}</div>
      <button
        class="card__fav"
        [class.active]="isFavorite()"
        (click)="onFavoriteClick($event, film().id)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</a>
